[package]
name = "night_streets"
version = "0.1.0"
edition = "2021"

[dependencies]
macroquad = "0.4"

# без оптимизаций игра в debug-режиме сильно тормозит, поэтому оптимизируем и dev
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# fontdue 0.9.5 (transitive dep of macroquad) uses u8/u16/u32::cast_signed(),
# which does not exist as an inherent method -> E0599 on many machines (WSL included).
# We ship a patched copy in vendor/ so the build works on ANY machine from a clean cache.
[patch.crates-io]
fontdue = { path = "vendor/fontdue-0.9.5" }
